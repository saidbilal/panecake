<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude Deck</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="traffic drag">
      <button class="icon" id="btn-sidebar-1" title="Toggle sidebar (⌘B)"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 3v10"/></svg></button>
      <button class="icon" id="btn-back" title="Back (⌘[)"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg></button>
      <button class="icon" id="btn-forward" title="Forward (⌘])"><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></button>
    </div>
    <nav class="primary">
      <button class="nav" id="btn-new"><svg viewBox="0 0 16 16"><path d="M8 2.5v11M2.5 8h11"/></svg><span>New</span><kbd>⌘N</kbd></button>
      <label class="nav search"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
        <input id="search" placeholder="Search" spellcheck="false" autocomplete="off"><kbd id="search-kbd">⌘K</kbd></label>
    </nav>
    <div id="search-status" hidden></div>
    <div id="list" tabindex="-1"></div>
    <footer>
      <span id="live-summary"></span>
      <button class="icon" id="btn-settings" title="Settings"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
    </footer>
    <div id="resizer"></div>
  </aside>
  <main>
    <header class="drag" id="titlebar">
      <button class="icon" id="btn-sidebar-2" title="Show sidebar (⌘B)" hidden><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 3v10"/></svg></button>
      <div class="title-wrap"><span id="title"></span><span id="subtitle"></span></div>
      <div class="actions" id="actions" hidden>
        <button class="icon" id="btn-terminal" title="New terminal in this folder (⌘J)"><svg viewBox="0 0 16 16"><path d="M2.5 4l4 4-4 4M8 12.5h5.5"/></svg></button>
        <button class="icon" id="btn-fork" title="Fork: starts a new session from here. This one stays as it is."><svg viewBox="0 0 16 16"><path d="M1.5 8.5h3.4c.8 0 1.5-.3 2.1-.9L12.8 2.8"/><path d="M9.2 2.5h3.8v3.8"/><path d="M8.6 9.3l4.2 3.9"/><path d="M13 9.7v3.8H9.2"/></svg></button>
        <button class="icon" id="btn-finder" title="Open folder in Finder"><svg viewBox="0 0 16 16"><path d="M1.5 4.5a1 1 0 011-1h3.2l1.5 1.5h6.3a1 1 0 011 1v6.5a1 1 0 01-1 1h-11a1 1 0 01-1-1z"/></svg></button>
        <button class="icon" id="btn-close-term" title="Stop this process (a chat stays in the sidebar)"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
      </div>
    </header>
    <div id="stage">
      <div id="terms"></div>
      <div id="grid"></div>
    </div>
  </main>
</div>
<div id="drop-layer" hidden></div>
<div id="drop-preview" hidden><span></span></div>
<div id="drag-ghost" hidden></div>
<div id="menu" hidden></div>
<div id="popover" hidden></div>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="vendor/marked.umd.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/addon-unicode11.js"></script>
<script src="app.js"></script>
</body>
</html>
